name: Release

# On every push to main:
# - if there are pending changesets, open or update a "Version packages" pull request;
# - when that pull request is merged, publish the new versions to npm.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored in this
# repository, and every package gets a provenance attestation linking it to the
# commit and workflow that built it. Each package must have this workflow
# configured as a trusted publisher on npmjs.com (see README > Releasing).

on:
  push:
    branches: [main]

# Only one release at a time; never cancel a publish halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commits and git tags
      pull-requests: write # the "Version packages" pull request
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest && npm --version
      - name: Cache FHIR packages
        uses: actions/cache@v6
        with:
          path: ~/.fhir/packages
          key: fhir-packages-hl7.fhir.r4.core-4.0.1
      - run: pnpm install --frozen-lockfile
      # Never publish what doesn't pass the tests (PGlite; CI also runs them on Postgres).
      - run: pnpm test
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN / NODE_AUTH_TOKEN on purpose: setting one would skip OIDC.
      - name: Push release tags
        if: steps.changesets.outputs.published == 'true'
        run: git push origin --tags
