name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache FHIR packages
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-hl7.fhir.r4.core-4.0.1
      - run: pnpm install --frozen-lockfile
      # Downloads hl7.fhir.r4.core@4.0.1 from packages.fhir.org on a cache miss.
      # Fails if packages/r4/src/generated is out of date with the generator.
      - run: pnpm test
