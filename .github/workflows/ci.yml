name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The store tests run on PGlite always, and on this real Postgres too
    # (FHIRFORGE_TEST_DATABASE_URL), to catch what PGlite can't show:
    # concurrent connections, locking and transaction isolation.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FHIRFORGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache FHIR packages
        uses: actions/cache@v6
        with:
          path: ~/.fhir/packages
          key: fhir-packages-hl7.fhir.r4.core-4.0.1
      - run: pnpm install --frozen-lockfile
      # Downloads hl7.fhir.r4.core@4.0.1 from packages.fhir.org on a cache miss.
      # Fails if packages/r4/src/generated is out of date with the generator.
      - run: pnpm test
